<!doctype html>
<html lang="pt-BR" data-tema="escuro" data-texto="normal">
<head>
  <meta charset="utf-8">
  <!-- Content-Security-Policy: o app só carrega código e dados do próprio site e só fala com o próprio site e com api.github.com
       (usado para publicar radares e textos). Assim, mesmo que algum script estranho rodasse aqui, o token do GitHub guardado
       no aparelho não teria para onde ser enviado. Script inline não é permitido: scripts ficam em arquivos (js/). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://api.github.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Playbook T</title>
  <meta name="description" content="Playbook de táticas do lado T para CS2: consulta rápida para o IGL e estudo do time.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Playbook T">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/glass.css">
  <script src="js/tema-inicial.js"></script>
</head>
<body>
  <header class="appbar" id="appbar"></header>
  <main id="main" tabindex="-1">
    <div class="splash" role="status" aria-label="Carregando"><span class="spinner"></span></div>
    <noscript><p class="intro">Ative o JavaScript do navegador para usar o playbook.</p></noscript>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Seções"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
